name: Build release

# Builds the T-Money installers on GitHub's Windows runner from a tagged commit, runs every test
# first, and attests that the published installers were built from that exact source. Anyone can
# then check a download with `gh attestation verify <file> --repo HuskerMinion/t-money` without
# trusting the maintainer's machine. Building here also means no path from anyone's own computer
# ends up inside the app.
#
# The installers are not code-signed (a certificate costs money every year). The attestation and
# SHA256SUMS.txt are how a download is checked instead; the README says how.
#
# A tag vX.Y.Z must match the version in src-tauri/tauri.conf.json, or nothing is built. The
# release is created as a draft: the maintainer reads it and presses Publish. A run started by
# hand builds and uploads the installers as a workflow artifact only, for testing.
#
# Every action is pinned to a full commit SHA, with the release it belongs to in the comment
# beside it. A tag is a moving pointer its own author can repoint, so moving one forward is a
# deliberate edit: read what changed, and change the SHA and the comment together.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          app="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$app" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version $app" >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install
        run: npm ci

      # One command per step: on Windows the default shell only checks the last command's exit code.
      - name: Type check
        run: npx tsc --noEmit

      - name: Test (frontend)
        run: npx vitest run

      - name: Test (Rust)
        working-directory: src-tauri
        run: cargo test

      # The first build compiles SQLCipher and OpenSSL from source; expect 15 to 30 minutes.
      - name: Build installers
        run: npx tauri build

      - name: Collect
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/nsis/*.exe out/
          cp src-tauri/target/release/bundle/msi/*.msi out/
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/*.exe
            out/*.msi

      - name: Draft release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --draft --verify-tag \
            --title "T-Money ${GITHUB_REF_NAME}" \
            --notes "Installers for Windows 10 and 11. They are not code-signed; see the README for the SmartScreen warning and how to check a download."

      - name: Upload (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: t-money-installers
          path: out/
